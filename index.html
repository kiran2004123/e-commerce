<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Azure Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #0078D4;
            color: white;
            padding: 20px;
        }

        .container {
            margin-top: 50px;
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005A9E;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Hosted on Microsoft Azure</p>
    </header>

    <div class="container">
        <h2>Hello World!</h2>
        <p>This is a simple HTML website deployed on Azure.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Website is running successfully on Azure!";
        }
    </script>

</body>
</html>
